name: sportzone
description: "SportZone – Ứng dụng đặt sân thể thao (PRM393)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0

  # Session & storage
  shared_preferences: ^2.3.2

  # Security
  crypto: ^3.0.3

  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Formatting
  intl: ^0.19.0

  # Routing
  go_router: ^14.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13

dependency_overrides:
  shared_preferences_android: 2.3.4

flutter:
  uses-material-design: true
